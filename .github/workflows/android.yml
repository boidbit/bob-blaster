name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web assets into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK (installable on any phone for testing)
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: blob-blaster-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Signed Play Store bundle + signed APK: only runs when you add the 4 secrets described in PLAY_STORE.md
      - name: Build signed release AAB and APK
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
          cat > keystore.properties <<PROPS
          storeFile=upload.jks
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          PROPS
          ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: blob-blaster-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # Publishes the build as a GitHub Release so it can be downloaded straight from a phone (Releases section of the repo).
      # Version 1.0.<run number>, versionCode <run number>. With the signing secrets it also carries the signed APK and the Play Store AAB.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk blob-blaster-$V-debug.apk
          FILES="blob-blaster-$V-debug.apk"
          NOTES="Version $V (versionCode ${{ github.run_number }}). Download an .apk below on your Android phone and install it (allow 'install unknown apps' for your browser)."
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/apk/release/app-release.apk blob-blaster-$V.apk
            cp android/app/build/outputs/bundle/release/app-release.aab blob-blaster-$V.aab
            FILES="blob-blaster-$V.apk blob-blaster-$V.aab $FILES"
            NOTES="$NOTES blob-blaster-$V.aab is the signed bundle to upload to Google Play; blob-blaster-$V.apk is the same build signed for direct install."
          fi
          gh release create "v$V" $FILES --title "Blob Blaster $V" --notes "$NOTES" --prerelease
