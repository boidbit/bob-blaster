<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15101F">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Blob Blaster</title>
<style>
/* Fonts ship inside the app (see fonts/LICENSES.md), so the game works fully offline. */
@font-face{font-family:"Lilita One";font-style:normal;font-weight:400;font-display:block;src:url("fonts/lilita-one-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:block;src:url("fonts/figtree-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:700;font-display:block;src:url("fonts/figtree-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:800;font-display:block;src:url("fonts/figtree-latin-800-normal.woff2") format("woff2")}

/* Layout: portrait arcade screen. Sticker-style UI: cream panels, thick ink outlines, hard drop shadows, chunky buttons. Single dark frame by design. */
:root{
  --bg:#15101F; --ink:#1A0A2A; --paper:#FFF3E2; --paper2:#F1DEC2; --muted:#6E5C78; --track:#3A2A4E;
  --gold:#FFD23F; --green:#3CCB6C; --blue:#3FB7F0; --pink:#FF5E9C; --red:#FF4D4D; --off:#BFB0C9;
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* system-bar / notch space. env() covers modern WebViews, the --safe-area-* vars come from Capacitor's SystemBars plugin on older ones */
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));
  --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--paper);height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font:14px/1.3 var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Full screen: the HUD sits at the top (below the status bar / camera cut-out), the play field fills everything under it
   edge to edge. resize() sizes the field: full width, and as tall as the screen is. */
.app{position:fixed;inset:0}
.wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end}
.ol{color:#fff;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}

/* HUD */
.hud{position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);pointer-events:none;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;width:100%;max-width:480px;
  padding:calc(8px + var(--sat)) max(14px,var(--sar)) 12px max(14px,var(--sal))}
.pill{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:1px 10px;font:400 18px var(--display);
  box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.coin-ic{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);flex:none}
.bar{height:18px;border-radius:10px;background:var(--track);border:3px solid var(--ink);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.bar div{height:100%;width:0;background:var(--gold);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.45)}
.sq{pointer-events:auto;width:38px;height:38px;border-radius:11px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.sq:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sq svg{width:22px;height:22px}

/* Stage */
.stage{position:relative;flex:none;overflow:hidden;background:#1B1030}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.overlay{position:absolute;inset:0;display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr);place-items:center;padding:calc(62px + var(--sat)) 14px 14px;background:rgba(10,4,20,.45)}

/* Panels */
/* The card is laid out at 300px and scaled down with --ui (set in fitCard) when the play field is smaller */
.card{width:300px;max-width:none;max-height:calc(100% / var(--ui,1));scale:var(--ui,1);overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 6px 0 var(--ink);padding:16px 14px;text-align:center;display:grid;gap:12px;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.ribbon{justify-self:center;background:var(--rib,var(--pink));border:3px solid var(--ink);border-radius:12px;padding:2px 18px 4px;
  font:400 26px var(--display);box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap}
.logo{font:400 52px/0.9 var(--display);display:grid;justify-items:center;gap:2px;padding-block:6px}
.logo span:first-child{color:var(--gold);transform:rotate(-4deg)}
.logo span:last-child{color:var(--pink);transform:rotate(2deg)}
.logo span{text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 7px 0 var(--ink)}
.sub{font:400 17px var(--display);color:var(--muted)}
.lbl{font:400 15px var(--display);color:var(--muted);letter-spacing:.04em;margin-bottom:-4px;text-align:left}
.reward{display:flex;justify-content:center;align-items:center;gap:8px;font:400 30px var(--display)}
.reward .coin-ic{width:24px;height:24px;border-width:3px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.stars svg{width:48px;height:48px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) backwards}
.stars svg:nth-child(2){width:62px;height:62px;animation-delay:.12s}
.stars svg:nth-child(3){animation-delay:.24s}

/* Buttons */
.btn{font:400 24px var(--display);border:3px solid var(--ink);border-radius:16px;padding:8px 18px 11px;cursor:pointer;background:var(--green);
  box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.btn.blue{background:var(--blue)} .btn.red{background:var(--red)} .btn.small{font-size:17px;padding:5px 12px 7px;border-radius:12px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tip{margin:0;font:600 13px/1.35 var(--body);color:var(--muted)}

/* Settings: the list scrolls, the button row stays pinned at the bottom so DONE / RESUME is always visible */
.card.still{animation:none}
.card.settings{display:flex;flex-direction:column;gap:10px;overflow:hidden;padding-bottom:12px}
.card.settings>.ribbon,.card.settings>.foot{flex:none}
.scroller{display:grid;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;flex:1 1 auto;padding:2px 2px 6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rows{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 8px 4px 12px;font:400 18px var(--display)}
.tog{width:56px;height:30px;border-radius:999px;border:3px solid var(--ink);background:var(--off);position:relative;cursor:pointer;padding:0;flex:none}
.tog i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--green)}
.tog[aria-checked="true"] i{transform:translateX(26px)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 8px;cursor:pointer;
  font:700 13px var(--body);color:var(--ink);text-align:left;min-width:0}
.chip .sw{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);flex:none}
.chip[aria-pressed="true"]{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.danger{display:grid;gap:8px;background:#FFE1DC;border:3px dashed var(--ink);border-radius:12px;padding:10px}
.danger p{margin:0;font:700 13px var(--body)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.card,.stars svg{animation:none}.tog i,.btn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="pill" id="lvl">LV 1</div>
    <div class="bar" aria-label="Level progress"><div id="prog"></div></div>
    <div class="pill"><span class="coin-ic"></span><span id="coins">0</span></div>
    <button class="sq" id="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#1A0A2A"><circle cx="12" cy="12" r="7.2"/>
        <rect x="10.4" y="1.2" width="3.2" height="21.6" rx="1.2"/><rect x="10.4" y="1.2" width="3.2" height="21.6" rx="1.2" transform="rotate(45 12 12)"/>
        <rect x="10.4" y="1.2" width="3.2" height="21.6" rx="1.2" transform="rotate(90 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="21.6" rx="1.2" transform="rotate(135 12 12)"/></g>
        <circle cx="12" cy="12" r="3.2" fill="#FFF3E2"/></svg>
    </button>
  </div>
  <div class="wrap" id="wrap"><div class="stage" id="stage">
    <canvas id="cv" aria-label="Game field. Hold and drag to move the cannon and shoot."></canvas>
    <div class="overlay" id="ov"></div>
  </div></div>
</div>

<script>
(()=>{
const LW=360,G=850,TAU=Math.PI*2;
const hudEl=document.querySelector('.hud');
let LH=600,GROUND=LH-72,HUDB=60;   // HUDB = y just under the HUD bar, in field units   // LH grows on tall phones so the field fills the whole screen (see resize)
const rnd=(a,b)=>a+Math.random()*(b-a);
const RAD=[14,21,30,41];
const BOUNCE=[190,250,300,350].map(h=>Math.sqrt(2*G*h));
const COL=[
  {b:'#5EE6A8',l:'#C4FFE6',d:'#13704C'},
  {b:'#4CC9F0',l:'#C2F0FF',d:'#145A7E'},
  {b:'#FFB547',l:'#FFE6B0',d:'#9E5A08'},
  {b:'#FF6B9A',l:'#FFC7D8',d:'#93204A'},
];
const INK='#1A0A2A',CONF=['#FFD23F','#FF5E9C','#3FB7F0','#3CCB6C','#FFFFFF'];
const FONT='"Lilita One", "Arial Rounded MT Bold", Impact, sans-serif';
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n);
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}

/* ---------- save ---------- */
const KEY='blobblaster.v2';
let S={level:1,coins:0,best:1,set:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.level==='number')S=Object.assign(S,s);}catch(e){}
delete S.rate;delete S.dmg;                       // older builds stored manual upgrades here
S.set=Object.assign({sfx:true,vib:true,shake:true,bg:'random'},S.set||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* The cannon never changes: same fire rate and damage on every level. Levels get harder because the blobs do
   (more of them, bigger, more HP) -- see levelShape(). The functions keep a level argument so tools can call them. */
const FIRE_RATE=9,DAMAGE=.6;   // total power (fire rate x damage) is 40% below the old 9 shots/s x 1 damage
const fireRate=l=>FIRE_RATE, damage=l=>DAMAGE;

/* ---------- audio ---------- */
let ac=null,noiseBuf=null,lastPew=0;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);}catch(e){ac=null}
}
function osc(type,f0,f1,dur,vol,delay=0){if(!ac||!S.set.sfx)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,freq){if(!ac||!S.set.sfx)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;
  f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+dur);}
const sfx={
  pew(){const n=performance.now();if(n-lastPew<50)return;lastPew=n;osc('square',1200,600,.045,.014)},
  pop(s,c){noise(.18+s*.06,.22+s*.05,1500-s*220);osc('sine',(440-s*60)*(1+Math.min(c,8)*.06),70,.22+s*.05,.25)},
  hurt(){osc('sawtooth',260,90,.3,.12);noise(.2,.2,600)},
  boom(){noise(.7,.4,700);osc('sawtooth',300,40,.8,.15)},
  win(){[523,659,784,1046,1318].forEach((f,i)=>osc('triangle',f,f,.28,.12,i*.08))},
  click(){osc('triangle',520,700,.06,.08)}
};
const buzz=ms=>{if(!S.set.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- glow sprites ---------- */
function glowSprite(color){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,hexA(color,.6));gr.addColorStop(.35,hexA(color,.25));gr.addColorStop(1,hexA(color,0));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const GLOW=COL.map(c=>glowSprite(c.b)),G_GOLD=glowSprite('#FFD36E'),G_WHITE=glowSprite('#FFFFFF'),G_CYAN=glowSprite('#5CF2FF'),G_ORANGE=glowSprite('#FF7A1A');

/* ---------- backgrounds ---------- */
function skyGrad(g,stops){const s=g.createLinearGradient(0,0,0,GROUND);stops.forEach((c,i)=>s.addColorStop(i/(stops.length-1),c));g.fillStyle=s;g.fillRect(0,0,LW,GROUND);}
function groundGrad(g,a,b){const s=g.createLinearGradient(0,GROUND,0,LH);s.addColorStop(0,a);s.addColorStop(1,b);g.fillStyle=s;g.fillRect(0,GROUND,LW,LH-GROUND);}
function ridge(g,base,amp,col,f1,f2,ph=0){g.fillStyle=col;g.beginPath();g.moveTo(0,GROUND+1);for(let x=0;x<=LW;x+=4)g.lineTo(x,base-amp*(.5+.5*Math.sin(x*f1+ph))*(.6+.4*Math.sin(x*f2+ph*.7)));g.lineTo(LW,GROUND+1);g.closePath();g.fill();}
function halo(g,x,y,r0,r1,col,a){const h=g.createRadialGradient(x,y,r0,x,y,r1);h.addColorStop(0,hexA(col,a));h.addColorStop(1,hexA(col,0));g.fillStyle=h;g.fillRect(0,0,LW,LH);}
function peaks(g,base,pts,col,cap){
  g.fillStyle=col;g.beginPath();g.moveTo(0,GROUND+1);g.lineTo(0,base);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(LW,base);g.lineTo(LW,GROUND+1);g.closePath();g.fill();
  if(!cap)return;g.fillStyle=cap;
  pts.forEach((p,i)=>{const a=pts[i-1]||[0,base],b=pts[i+1]||[LW,base];if(!(p[1]<a[1]&&p[1]<b[1]))return;
    const L=[p[0]+(a[0]-p[0])*.28,p[1]+(a[1]-p[1])*.28],R=[p[0]+(b[0]-p[0])*.28,p[1]+(b[1]-p[1])*.28],my=(L[1]+R[1])/2;
    g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(R[0],R[1]);g.lineTo(p[0]+6,my-3);g.lineTo(p[0]-2,my+4);g.lineTo(p[0]-8,my-2);g.lineTo(L[0],L[1]);g.closePath();g.fill();});
}
const THEMES=[
  {id:'night',name:'Neon Night',sw:['#2A0F5C','#9C2F86'],glow:.9,line:'#FF8CC8',dust:'#B98CFF',
    build(g){skyGrad(g,['#0C0629','#2A0F5C','#5A1A78','#9C2F86']);
      const px=282,py=118,pr=54;halo(g,px,py,pr*.8,pr*2.4,'#5CF2FF',.22);
      g.save();g.translate(px,py);g.rotate(-.35);g.strokeStyle='rgba(255,214,140,.55)';g.lineWidth=6;g.beginPath();g.ellipse(0,0,pr*1.85,pr*.32,0,Math.PI,TAU);g.stroke();g.restore();
      const pg=g.createRadialGradient(px-pr*.4,py-pr*.45,pr*.1,px,py,pr);pg.addColorStop(0,'#A6F7FF');pg.addColorStop(.5,'#4C6BE0');pg.addColorStop(1,'#1E1260');
      g.fillStyle=pg;g.beginPath();g.arc(px,py,pr,0,TAU);g.fill();
      g.save();g.translate(px,py);g.rotate(-.35);g.strokeStyle='rgba(255,214,140,.8)';g.lineWidth=6;g.beginPath();g.ellipse(0,0,pr*1.85,pr*.32,0,0,Math.PI);g.stroke();g.restore();
      g.fillStyle='#FFB6D9';g.beginPath();g.arc(70,70,9,0,TAU);g.fill();
      const hz=g.createLinearGradient(0,GROUND-120,0,GROUND);hz.addColorStop(0,'rgba(255,94,180,0)');hz.addColorStop(1,'rgba(255,120,170,.45)');g.fillStyle=hz;g.fillRect(0,GROUND-120,LW,120);
      ridge(g,GROUND-6,58,'#3A1468',.021,.007,1.3);ridge(g,GROUND,34,'#24104A',.034,.013,.4);groundGrad(g,'#2A0F55','#0E0624');},
    init(){return Array.from({length:60},(_,i)=>({x:Math.random()*LW,y:Math.random()*(GROUND-80),r:Math.random()*1.4+.3,a:Math.random()*6,sp:i<20?6:2}))},
    anim(dt,A){for(const s of A){s.x-=s.sp*dt;if(s.x<0)s.x+=LW;s.a+=dt*2;ctx.fillStyle=`rgba(255,243,226,${.25+.45*Math.abs(Math.sin(s.a))})`;ctx.fillRect(s.x,s.y,s.r,s.r);}
      ctx.globalCompositeOperation='lighter';const vx=LW/2,vy=GROUND-70,H=LH-GROUND;ctx.lineWidth=1;
      for(let i=0;i<9;i++){const f=(i+gridT)/9,y=GROUND+H*f*f;ctx.strokeStyle=`rgba(255,94,180,${.08+.45*f})`;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(LW,y);ctx.stroke();}
      ctx.strokeStyle='rgba(255,94,180,.28)';for(let j=-8;j<=8;j++){const xb=vx+j*52,xg=vx+(xb-vx)*(GROUND-vy)/(LH-vy);ctx.beginPath();ctx.moveTo(xg,GROUND);ctx.lineTo(xb,LH);ctx.stroke();}
      ctx.globalCompositeOperation='source-over';}},
  {id:'desert',name:'Sunset Dunes',sw:['#C2457A','#FFC26B'],glow:.45,line:'#FFE3B0',dust:'#F7D29A',
    build(g){skyGrad(g,['#2B1B5A','#8A2F6E','#E0587A','#FF9A55','#FFCF7A']);
      halo(g,110,GROUND-150,40,190,'#FFE6A0',.5);g.fillStyle='#FFE9A8';g.beginPath();g.arc(110,GROUND-150,56,0,TAU);g.fill();
      g.fillStyle='#8C3460';const mesa=(x,w,h)=>{g.beginPath();g.moveTo(x,GROUND);g.lineTo(x+w*.12,GROUND-h);g.lineTo(x+w*.88,GROUND-h);g.lineTo(x+w,GROUND);g.closePath();g.fill();};
      mesa(180,120,120);mesa(270,110,80);mesa(-30,90,70);
      ridge(g,GROUND-10,40,'#C24F6C',.018,.006,2);ridge(g,GROUND,26,'#E07F5C',.025,.009,.8);
      const cactus=(x,h)=>{g.fillStyle='#4E1A3E';const rr2=(X,Y,W,H)=>{g.beginPath();g.roundRect?g.roundRect(X,Y,W,H,W/2):g.rect(X,Y,W,H);g.fill();};
        rr2(x-5,GROUND-h,10,h+4);rr2(x-17,GROUND-h*.7,7,h*.32);rr2(x-17,GROUND-h*.45,14,7);rr2(x+10,GROUND-h*.85,7,h*.35);rr2(x+3,GROUND-h*.55,14,7);};
      cactus(40,62);cactus(318,48);
      groundGrad(g,'#F0B26A','#B5603A');g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;
      for(let i=0;i<5;i++){const y=GROUND+12+i*12;g.beginPath();for(let x=0;x<=LW;x+=8)g.lineTo(x,y+Math.sin(x*.05+i)*3);g.stroke();}},
    init(){return Array.from({length:28},()=>({x:Math.random()*LW,y:rnd(GROUND-200,GROUND),r:rnd(.8,2),sp:rnd(12,30)}))},

let theme=THEMES[0],amb=[];
function setTheme(t){theme=t;amb=t.init();bg=null;}
function pickTheme(){
  if(S.set.bg!=='random'){setTheme(THEMES.find(t=>t.id===S.set.bg)||THEMES[0]);return;}
  const opts=THEMES.filter(t=>t!==theme);setTheme(opts[Math.floor(Math.random()*opts.length)]);

/* ---------- game state ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),ov=document.getElementById('ov');
let k=1,dpr=1,bg=null;
let state='menu',prevState=null,blobs=[],bullets=[],parts=[],queue=[],spawnT=0,dealt=0,total=1,earned=0;
let shake=0,timeScale=1,slowT=0,freezeT=0,fireT=0,firing=false,pending=null,levelPlayed=S.level;
let lives=3,inv=0,flashRed=0,screenFlash=0,combo=0,comboT=0,comboPop=0,banner=-1,time=0,gridT=0,fired=false;
const cannon={x:LW/2,tx:LW/2,recoil:0,flash:0,alive:true};

function tot(h,s){return h+(s>0?2*tot(Math.ceil(h/2),s-1):0)}
/* Level recipe: how many blobs, the biggest size, and the HP scale. The first blob is always the biggest size,
   each later one is the biggest size or one step smaller (50/50). */
const SIZE_HP=[.4,.6,.8,1];
/* Difficulty. The cannon never gets stronger, so a level gets harder by having more blob HP to chew through:
   the longer it takes, the longer you have to dodge. hpTarget(L) is the total HP (splits included) we aim for;
   count / biggest size grow with the level and the per-blob HP is chosen to land on that target. */
const hpTarget=L=>L<=8?10+8*L:74+7*(L-8);
function levelShape(L){
  const count=Math.min(6,1+Math.ceil(L/2)),maxS=Math.min(3,Math.ceil(L/2));
  if(!_base[L]){let b=2;while(shapeHP(count,maxS,b)<hpTarget(L))b++;_base[L]=b;}
  return {count,maxS,base:_base[L]};
}
const _base=[];
const blobHP=(base,s)=>Math.max(1,Math.round(base*SIZE_HP[s]));
function makeQueue(L){
  const {count,maxS,base}=levelShape(L),q=[];
  for(let i=0;i<count;i++){const s=i===0?maxS:Math.max(0,maxS-(Math.random()<.5?1:0));q.push({s,hp:blobHP(base,s)});}
  return q;
}
/* Average total HP of a level (all the splits included) for a given shape. */
function shapeHP(count,maxS,base){
  let sum=0;
  for(let i=0;i<count;i++){
    const opts=i===0?[[maxS,1]]:[[maxS,.5],[Math.max(0,maxS-1),.5]];
    for(const [s,p] of opts)sum+=p*tot(blobHP(base,s),s);
  }
  return sum;
}
const levelHP=L=>{const {count,maxS,base}=levelShape(L);return shapeHP(count,maxS,base)};
function newBlob(s,hp,x,y,vx,vy){return {s,hp,max:hp,r:RAD[s],x,y,vx,vy,sq:0,pu:0,fl:0,ph:Math.random()*10}}
function startLevel(){
  initAudio();pickTheme();
  blobs=[];bullets=[];parts=[];queue=makeQueue(S.level);levelPlayed=S.level;
  total=queue.reduce((a,b)=>a+tot(b.hp,b.s),0);dealt=0;earned=0;spawnT=.6;
  cannon.alive=true;cannon.x=cannon.tx=LW/2;timeScale=1;slowT=0;freezeT=0;pending=null;firing=false;
  lives=3;inv=0;combo=0;comboT=0;banner=-1;flashRed=0;screenFlash=0;
  state='play';ov.hidden=true;hud();
}
function spawn(q){
  const r=RAD[q.s],left=Math.random()<.5;
  blobs.push(newBlob(q.s,q.hp,left?-r:LW+r,rnd(80,150),(left?1:-1)*rnd(45,68),0));
}

/* ---------- input ---------- */
function toX(e){const b=cv.getBoundingClientRect();return (e.clientX-b.left)/b.width*LW}
cv.addEventListener('pointerdown',e=>{initAudio();if(state!=='play')return;firing=true;fired=true;cannon.tx=toX(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(firing)cannon.tx=toX(e)});
const release=()=>{firing=false};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight',' '].includes(e.key)&&state==='play'){keys[e.key]=true;e.preventDefault();initAudio();if(e.key===' ')fired=true;}
  if(e.key==='Escape'){ovKind==='settings'?closeSettings():openSettings();}
  if(e.key==='Enter'&&!ov.hidden){const b=document.getElementById('go');b&&b.click();}});
addEventListener('keyup',e=>{keys[e.key]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){firing=false;for(const kk in keys)keys[kk]=false;if(state==='play')openSettings();}});

/* ---------- events ---------- */
function addShake(n){if(S.set.shake)shake=Math.min(20,shake+n)}
function burst(x,y,c,n,sp,sz){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(sp*.3,sp);parts.push({k:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:1,dec:rnd(1.1,1.8),r:rnd(sz*.5,sz),c});}}
function hit(b,u){
  const dmg=damage(levelPlayed),before=b.hp;b.hp=Math.round((b.hp-dmg)*10)/10;dealt+=Math.min(dmg,before);b.pu=1;b.fl=1;
  parts.push({k:'spark',x:u.x,y:b.y+b.r*.85,life:1});
  if(b.hp<=0)pop(b);
}
function pop(b){
  blobs.splice(blobs.indexOf(b),1);
  combo=comboT>0?combo+1:1;comboT=1.5;comboPop=1;
  burst(b.x,b.y,COL[b.s].b,12+b.s*8,280+b.s*70,3.5+b.s*1.6);
  for(let i=0;i<5+b.s*3;i++){const a=Math.random()*TAU,v=rnd(60,220);parts.push({k:'star',x:b.x,y:b.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,s:rnd(3,7)});}
  parts.push({k:'ring',x:b.x,y:b.y,r:b.r,life:1,c:COL[b.s].l});
  parts.push({k:'flash',x:b.x,y:b.y,r:b.r*2,life:1});
  addShake(3+b.s*2.5);sfx.pop(b.s,combo);buzz(10+b.s*8);
  if(b.s>=2){freezeT=.045;if(S.set.shake)screenFlash=.22;}
  const bonus=combo>=3?Math.floor(combo/3):0,val=(b.s+1)+Math.floor(levelPlayed/2)+bonus;
  parts.push({k:'txt',x:b.x,y:b.y-b.r,text:'+'+val,life:1,size:15+b.s*3});
  S.coins+=val;earned+=val;save();
  if(b.s>0){const h=Math.ceil(b.max/2),s=b.s-1,r=RAD[s],sp=Math.max(65,Math.abs(b.vx));
    for(const dir of [-1,1]){const nb=newBlob(s,h,b.x+dir*r*.5,Math.min(b.y,GROUND-r-4),dir*sp,-360);nb.pu=.6;nb.fl=.6;blobs.push(nb);}}
  if(!blobs.length&&!queue.length&&cannon.alive){
    slowT=1.2;banner=0;sfx.win();buzz([20,30,20,30,40]);
    for(let i=0;i<70;i++)parts.push({k:'conf',x:rnd(0,LW),y:rnd(-80,-5),vx:rnd(-40,40),vy:rnd(60,160),rot:rnd(0,6),vr:rnd(-8,8),c:CONF[i%CONF.length],life:3});
    pending={t:1.8,fn:levelClear};
  }
}
function hurt(b){
  lives--;inv=1.8;addShake(16);flashRed=1;sfx.hurt();buzz([40,30,40]);
  b.vy=-BOUNCE[b.s]*1.05;b.vx=(b.x<cannon.x?-1:1)*Math.max(70,Math.abs(b.vx));b.y=Math.min(b.y,GROUND-b.r-40);
  burst(cannon.x,GROUND-20,'#FF5E9C',14,240,3);
  if(lives<=0)die();
}
function die(){
  cannon.alive=false;firing=false;addShake(24);sfx.boom();buzz([30,40,80]);
  burst(cannon.x,GROUND-18,'#FFF3E2',28,400,4);burst(cannon.x,GROUND-18,'#FFD23F',20,320,3.5);
  parts.push({k:'ring',x:cannon.x,y:GROUND-18,r:24,life:1,c:'#FFD23F'});parts.push({k:'flash',x:cannon.x,y:GROUND-18,r:70,life:1});
  pending={t:1.2,fn:()=>{state='over';showOverlay('over')}};state='dying';
}
let starsWon=0;
function levelClear(){starsWon=lives;S.level++;S.best=Math.max(S.best,S.level);save();state='clear';showOverlay('clear');}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(state==='paused')return;
  if(freezeT>0){freezeT-=dt;return;}
  if(slowT>0){slowT-=dt;timeScale=.3}else timeScale=Math.min(1,timeScale+dt*3);
  const t=dt*timeScale;
  gridT=(gridT+t*.55)%1;
  if(pending){pending.t-=dt;if(pending.t<=0){const f=pending.fn;pending=null;f();}}
  inv=Math.max(0,inv-dt);flashRed=Math.max(0,flashRed-dt*2.5);screenFlash=Math.max(0,screenFlash-dt*4);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}comboPop=Math.max(0,comboPop-dt*6);
  if(banner>=0)banner+=dt;

  if(state==='play'&&cannon.alive){
    if(keys.ArrowLeft)cannon.tx-=340*dt;if(keys.ArrowRight)cannon.tx+=340*dt;
    cannon.tx=Math.max(24,Math.min(LW-24,cannon.tx));
    cannon.x+=(cannon.tx-cannon.x)*Math.min(1,dt*22);
    if(firing||keys[' ']){fireT-=t;let guard=0;
      while(fireT<=0&&guard++<4){bullets.push({x:cannon.x,y:GROUND-54});fireT+=1/fireRate(levelPlayed);cannon.recoil=1;cannon.flash=1;sfx.pew();}}
    else fireT=0;
    if(queue.length){spawnT-=t;if(spawnT<=0||(blobs.length===0&&spawnT<2.5)){spawn(queue.shift());spawnT=4.2;}}
  }
  cannon.recoil=Math.max(0,cannon.recoil-dt*14);cannon.flash=Math.max(0,cannon.flash-dt*16);

  for(let i=bullets.length-1;i>=0;i--){const u=bullets[i];u.y-=950*t;
    if(u.y<-20){bullets.splice(i,1);continue}
    for(const b of blobs){const dx=u.x-b.x,dy=u.y-b.y,rr=b.r+6;if(dx*dx+dy*dy<rr*rr){bullets.splice(i,1);hit(b,u);break;}}}

  for(const b of blobs){
    b.vy+=G*t;b.x+=b.vx*t;b.y+=b.vy*t;
    if(b.x-b.r<0&&b.vx<0){b.x=b.r;b.vx*=-1}
    if(b.x+b.r>LW&&b.vx>0){b.x=LW-b.r;b.vx*=-1}
    if(b.y+b.r>GROUND){b.y=GROUND-b.r;b.vy=-BOUNCE[b.s];b.sq=1;if(b.s>=2)addShake(1.5);
      for(let i=0;i<4;i++)parts.push({k:'dot',x:b.x+rnd(-b.r,b.r)*.6,y:GROUND,vx:rnd(-60,60),vy:rnd(-120,-40),life:.6,dec:2,r:2,c:theme.dust});}
    if(b.y-b.r<0&&b.vy<0){b.vy*=-1}
    b.sq=Math.max(0,b.sq-dt*5);b.pu=Math.max(0,b.pu-dt*9);b.fl=Math.max(0,b.fl-dt*10);
    if(cannon.alive&&state==='play'&&inv<=0){
      const nx=Math.max(cannon.x-16,Math.min(b.x,cannon.x+16)),ny=Math.max(GROUND-32,Math.min(b.y,GROUND));
      const dx=b.x-nx,dy=b.y-ny;if(dx*dx+dy*dy<b.r*b.r*.6){hurt(b);if(!cannon.alive)break;}
    }
  }


  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    switch(p.k){
      case 'dot':p.vy+=G*.6*t;p.x+=p.vx*t;p.y+=p.vy*t;p.life-=p.dec*t;break;
      case 'ring':p.life-=t*2.6;break;
      case 'flash':p.life-=dt*7;break;
      case 'spark':p.life-=dt*12;break;
      case 'star':p.vx*=.96;p.vy*=.96;p.x+=p.vx*t;p.y+=p.vy*t;p.life-=t*1.5;break;
      case 'txt':p.y-=45*t;p.life-=t*1.1;break;
      case 'conf':p.vy=Math.min(p.vy+120*t,200);p.x+=(p.vx+Math.sin(time*3+p.rot)*30)*t;p.y+=p.vy*t;p.rot+=p.vr*t;p.life-=dt*.5;if(p.y>LH+10)p.life=0;break;
    }
    if(p.life<=0)parts.splice(i,1);}
  shake=Math.max(0,shake-dt*40);
  hud();
}

/* ---------- render ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function glow(sp,x,y,r,a=1){ctx.globalAlpha=Math.min(1,a);ctx.drawImage(sp,x-r,y-r,r*2,r*2);}
function buildBg(){bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;const g=bg.getContext('2d');g.setTransform(k*dpr,0,0,k*dpr,0,0);theme.build(g);}
function outlined(txt,x,y,size,fill,lw){ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.strokeText(txt,x,y+size*.08);ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y);}
function draw(dt){
  ctx.setTransform(k*dpr,0,0,k*dpr,0,0);
  if(!bg)buildBg();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.restore();
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  theme.anim(state==='paused'?0:dt,amb);
  ctx.fillStyle=theme.line;ctx.globalAlpha=.9;ctx.fillRect(0,GROUND-1,LW,2);ctx.globalAlpha=1;

  for(const b of blobs){const h=Math.max(0,GROUND-b.y-b.r),a=Math.max(.06,.4-h/850),w=b.r*(1-Math.min(.5,h/600));
    ctx.fillStyle=`rgba(5,0,20,${a})`;ctx.beginPath();ctx.ellipse(b.x,GROUND+4,w,w*.22,0,0,TAU);ctx.fill();}

  ctx.globalCompositeOperation='lighter';
  for(const b of blobs)glow(GLOW[b.s],b.x,b.y,b.r*2.4,theme.glow*(1+b.fl*.6));
  for(const u of bullets){glow(G_GOLD,u.x,u.y+4,15,.9);
    const tr=ctx.createLinearGradient(0,u.y,0,u.y+34);tr.addColorStop(0,'rgba(255,214,110,.6)');tr.addColorStop(1,'rgba(255,214,110,0)');ctx.globalAlpha=1;ctx.fillStyle=tr;ctx.fillRect(u.x-2.5,u.y,5,34);}
  if(cannon.alive)glow(G_CYAN,cannon.x,GROUND-12,52,.6*theme.glow+.2);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  for(const u of bullets){ctx.fillStyle=INK;rr(u.x-4,u.y-10,8,19,4);ctx.fill();ctx.fillStyle='#FFF4B8';rr(u.x-2.2,u.y-8,4.4,15,2.2);ctx.fill();}
  for(const b of blobs)drawBlob(b);
  if(cannon.alive)drawCannon();

  for(const p of parts){
    const a=Math.max(0,Math.min(1,p.life));
    if(p.k==='dot'){ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.3,a),0,TAU);ctx.fill();}
    else if(p.k==='conf'){ctx.globalAlpha=Math.min(1,p.life);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-4,-2,8,4);ctx.restore();}
    else if(p.k==='txt'){ctx.globalAlpha=a;outlined(p.text,p.x,p.y,p.size,'#FFD23F',5);}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=Math.max(0,Math.min(1,p.life));
    if(p.k==='ring'){ctx.globalAlpha=a*.9;ctx.strokeStyle=p.c;ctx.lineWidth=4*a+1;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+(1-a)*1.6),0,TAU);ctx.stroke();}
    else if(p.k==='flash')glow(G_WHITE,p.x,p.y,p.r*(1.2+(1-a)),a);
    else if(p.k==='spark')glow(G_GOLD,p.x,p.y,14*a+4,a);
    else if(p.k==='star'){ctx.globalAlpha=a;ctx.fillStyle='#FFFFFF';star(p.x,p.y,p.s*a);}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.restore();

  HUDB=Math.round(hudEl.offsetHeight/k);
  if(state!=='menu')for(let i=0;i<3;i++)heart(22+i*26,HUDB+16,i<lives);
  if(combo>=2&&comboT>0){const s=1+comboPop*.45;ctx.save();ctx.translate(LW/2,HUDB+58);ctx.scale(s,s);ctx.rotate(-.04);ctx.globalAlpha=Math.min(1,comboT*2);
    outlined(`COMBO x${combo}`,0,0,26,'#FFD23F',7);ctx.restore();}
  if(state==='play'&&!fired){ctx.globalAlpha=.65+.35*Math.sin(time*5);outlined('HOLD & DRAG',LW/2,GROUND-118,26,'#FFFFFF',7);
    outlined('to move and fire',LW/2,GROUND-90,16,'#FFFFFF',5);ctx.globalAlpha=1;}
  if(banner>=0){const e=Math.min(1,banner/.35),s=e<1?(1-Math.pow(1-e,3))*1.15:1.15-.15*Math.min(1,(banner-.35)/.2);
    ctx.save();ctx.translate(LW/2,LH*.38);ctx.scale(s,s);ctx.rotate(-.06);outlined('CLEAR!',0,0,64,'#FFD23F',12);ctx.restore();}
  if(flashRed>0){const g=ctx.createRadialGradient(LW/2,LH/2,LH*.25,LW/2,LH/2,LH*.75);g.addColorStop(0,'rgba(255,40,90,0)');g.addColorStop(1,`rgba(255,40,90,${flashRed*.55})`);ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);}
  if(screenFlash>0){ctx.fillStyle=`rgba(255,255,255,${screenFlash})`;ctx.fillRect(0,0,LW,LH);}
}
function star(x,y,s){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();}
function heart(x,y,on){ctx.save();ctx.translate(x,y);const p=()=>{ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-15,-2,-10,-15,0,-7);ctx.bezierCurveTo(10,-15,15,-2,0,8);ctx.closePath();};
  p();ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle=on?'#FF4D6D':'#5A4A66';ctx.fill();
  if(on){ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-5,-5,2.6,1.8,-.6,0,TAU);ctx.fill();}ctx.restore();}
function drawBlob(b){
  const c=COL[b.s],r=b.r,wob=Math.sin(time*7+b.ph)*.035,pu=1+b.pu*.1;
  const sx=(1+b.sq*.22+wob)*pu,sy=(1-b.sq*.22-wob)*pu;
  ctx.save();ctx.translate(b.x,b.y+r*(1-sy));ctx.scale(sx,sy);
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,0,r+2.5,0,TAU);ctx.fill();
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,c.l);g.addColorStop(.55,c.b);g.addColorStop(1,c.d);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  if(b.fl>0){ctx.fillStyle=`rgba(255,255,255,${b.fl*.6})`;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(-r*.4,-r*.5,r*.22,r*.11,-.6,0,TAU);ctx.fill();
  const hasEyes=b.s>=1;
  if(hasEyes){
    const ex=r*.3,ey=-r*.22,er=r*.17,lx=Math.max(-1,Math.min(1,(cannon.x-b.x)/110)),blink=((time+b.ph)%3.4)<.12;
    for(const sgn of [-1,1]){const cx=sgn*ex;
      if(b.fl>.3){ctx.strokeStyle=INK;ctx.lineWidth=r*.08;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-sgn*er*.8,ey-er*.7);ctx.lineTo(cx+sgn*er*.6,ey);ctx.lineTo(cx-sgn*er*.8,ey+er*.7);ctx.stroke();}
      else if(blink){ctx.strokeStyle=INK;ctx.lineWidth=r*.07;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-er,ey);ctx.lineTo(cx+er,ey);ctx.stroke();}
      else{ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.ellipse(cx,ey,er,er*1.15,0,0,TAU);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle=INK;ctx.beginPath();ctx.arc(cx+lx*er*.38,ey+er*.35,er*.55,0,TAU);ctx.fill();
        ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(cx+lx*er*.38-er*.18,ey+er*.15,er*.18,0,TAU);ctx.fill();}
    }
  }
  const txt=fmt(Math.max(0,Math.ceil(b.hp))),L=txt.length;
  const fs=hasEyes?r*(L>2?.55:L>1?.68:.8):r*(L>1?.9:1.1),ty=hasEyes?r*.4:r*.04;
  ctx.font=`${fs}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,fs*.24);ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(txt,0,ty);
  ctx.fillStyle='#FFFFFF';ctx.fillText(txt,0,ty);
  ctx.restore();
}
function drawCannon(){
  const x=cannon.x,y=GROUND,rc=cannon.recoil*6;
  if(inv>0&&Math.floor(inv*14)%2===0)ctx.globalAlpha=.3;
  ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin='round';
  ctx.fillStyle='#F2ECFF';rr(x-7,y-54+rc,14,34,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#3FB7F0';ctx.fillRect(x-5.5,y-47+rc,11,4);
  ctx.fillStyle='#FFF3E2';ctx.beginPath();ctx.arc(x,y-14,22,Math.PI,TAU);ctx.lineTo(x+22,y-8);ctx.lineTo(x-22,y-8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(26,10,42,.12)';ctx.beginPath();ctx.arc(x,y-14,22,Math.PI*1.5,TAU);ctx.lineTo(x+22,y-8);ctx.lineTo(x,y-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FF5E9C';ctx.beginPath();ctx.arc(x,y-22,4.5,0,TAU);ctx.fill();ctx.lineWidth=2;ctx.stroke();
  ctx.lineWidth=3;ctx.fillStyle='#3A2A5A';rr(x-27,y-12,54,12,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#FFD23F';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(x+i*10,y-6,2.2,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  if(cannon.flash>0){ctx.globalCompositeOperation='lighter';glow(G_WHITE,x,y-58+rc,10+cannon.flash*10,cannon.flash);ctx.globalAlpha=cannon.flash;ctx.fillStyle='#FFF2B0';star(x,y-58+rc,9*cannon.flash+3);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
}

/* ---------- HUD + overlays ---------- */
const $=id=>document.getElementById(id);let lastProg=-1,lastCoins=-1,lastLvl='';
function hud(){
  const lv='LV '+(state==='clear'?S.level-1:state==='menu'?S.level:levelPlayed);if(lv!==lastLvl){lastLvl=lv;$('lvl').textContent=lv;}
  if(S.coins!==lastCoins){lastCoins=S.coins;$('coins').textContent=fmt(S.coins);}
  const p=state==='play'||state==='dying'||state==='paused'?Math.min(1,dealt/total):state==='clear'?1:0;
  if(Math.abs(p-lastProg)>.004){lastProg=p;$('prog').style.width=(p*100).toFixed(1)+'%';}
}
const STAR=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1.8 15.1,8.6 22.4,9.3 16.9,14.2 18.5,21.5 12,17.7 5.5,21.5 7.1,14.2 1.6,9.3 8.9,8.6"
  fill="${on?'#FFD23F':'#D8CBB6'}" stroke="#1A0A2A" stroke-width="2" stroke-linejoin="round"/>${on?'<ellipse cx="9.5" cy="9" rx="2" ry="1.2" fill="#fff" opacity=".7" transform="rotate(-30 9.5 9)"/>':''}</svg>`;
const TIPS=['Stay under the blob you are shooting. Slide away when it lands.','Big blobs bounce high. Watch the shadow on the floor.','Pop blobs back to back to build a combo and earn bonus coins.','Your hearts refill at the start of every level.'];
let ovKind='menu',settingsBack=null,confirmReset=false;
function showOverlay(kind){
  const again=!ov.hidden&&ovKind===kind,keepScroll=again&&document.querySelector('.scroller')?document.querySelector('.scroller').scrollTop:0;
  ovKind=kind;let h='';
  if(kind==='menu')h=`<div class="logo"><span>BLOB</span><span>BLASTER</span></div>
    ${S.best>1?`<div class="sub">Best: Level ${S.best}</div>`:''}<button class="btn ol" id="go">PLAY LEVEL ${S.level}</button>`;
  if(kind==='clear'){
    h=`<div class="ribbon ol" style="--rib:#3CCB6C">LEVEL ${S.level-1}</div>
    <div class="stars">${[1,2,3].map(i=>STAR(i<=starsWon)).join('')}</div>
    <div class="reward"><span class="coin-ic"></span>+${earned}</div>
    <div class="sub">Next: Level ${S.level}, tougher blobs!</div><button class="btn ol" id="go">NEXT</button>`;}
  if(kind==='over')h=`<div class="ribbon ol" style="--rib:#FF4D4D">OUT OF HEARTS</div>
    <div class="sub">${Math.floor(dealt/total*100)}% cleared</div><p class="tip">${TIPS[Math.floor(Math.random()*TIPS.length)]}</p><button class="btn ol" id="go">RETRY</button>`;
  if(kind==='settings'){
    const tg=(id,label,on)=>`<div class="row"><span>${label}</span><button class="tog" role="switch" id="${id}" aria-checked="${on}" aria-label="${label}"><i></i></button></div>`;
    const chip=(id,name,sw)=>`<button class="chip" id="bg-${id}" aria-pressed="${S.set.bg===id}"><span class="sw" style="background:linear-gradient(${sw[0]},${sw[1]})"></span>${name}</button>`;
    h=`<div class="ribbon ol" style="--rib:#3FB7F0">${state==='paused'?'PAUSED':'SETTINGS'}</div>
      <div class="scroller">
        <div class="rows">${tg('t-sfx','Sound',S.set.sfx)}${tg('t-vib','Vibration',S.set.vib)}${tg('t-shake','Screen Shake',S.set.shake)}</div>
        <div class="lbl">BACKGROUND</div>
        <div class="chips">${chip('random','Random',['#FF5E9C','#3FB7F0'])}${THEMES.map(t=>chip(t.id,t.name,t.sw)).join('')}</div>
        ${confirmReset?`<div class="danger"><p>Delete your coins and go back to level 1?</p><div class="btnrow"><button class="btn small blue ol" id="rs-no">KEEP</button><button class="btn small red ol" id="rs-yes">DELETE</button></div></div>`
          :`<button class="btn small red ol" id="rs">RESET PROGRESS</button>`}
      </div>
      <div class="foot">${state==='paused'?`<div class="btnrow"><button class="btn blue ol" id="quit">MENU</button><button class="btn ol" id="go">RESUME</button></div>`:`<button class="btn ol" id="go" style="width:100%">DONE</button>`}</div>`;
  }
  ov.innerHTML=`<div class="card${kind==='settings'?' settings':''}${again?' still':''}">${h}</div>`;ov.hidden=false;
  fitCard();
  const sc=document.querySelector('.scroller');if(sc&&keepScroll)sc.scrollTop=keepScroll;
  wire(kind);
}
function wire(kind){
  if(kind==='settings'){
    $('go').onclick=closeSettings;
    const q=$('quit');if(q)q.onclick=toMenu;
    [['t-sfx','sfx'],['t-vib','vib'],['t-shake','shake']].forEach(([id,key])=>$(id).onclick=()=>{S.set[key]=!S.set[key];save();initAudio();sfx.click();if(key==='vib')buzz(20);showOverlay('settings');});
    ['random',...THEMES.map(t=>t.id)].forEach(id=>$('bg-'+id).onclick=()=>{S.set.bg=id;save();sfx.click();
      if(id==='random')pickTheme();else setTheme(THEMES.find(t=>t.id===id));showOverlay('settings');});
    if($('rs'))$('rs').onclick=()=>{confirmReset=true;showOverlay('settings');};
    if($('rs-no'))$('rs-no').onclick=()=>{confirmReset=false;showOverlay('settings');};
    if($('rs-yes'))$('rs-yes').onclick=()=>{const set=S.set;S={level:1,coins:0,best:1,set};save();confirmReset=false;levelPlayed=1;toMenu();};
    return;
  }
  $('go').onclick=()=>{sfx.click();startLevel();};
}
/* Shrink the panel to fit short or narrow windows (split screen, tiny phones) instead of clipping it */
function fitCard(){
  const card=ov.querySelector('.card');if(!card||ov.hidden)return;
  card.style.setProperty('--ui','1');
  const cs=getComputedStyle(ov),availW=ov.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),availH=ov.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let ui=Math.min(1,availW/300);
  if(!card.classList.contains('settings'))ui=Math.min(ui,availH/(card.scrollHeight+8));   // +8 for the drop shadow
  card.style.setProperty('--ui',Math.max(.45,ui).toFixed(3));
}
function openSettings(){
  if(ovKind==='settings'&&!ov.hidden)return;
  initAudio();confirmReset=false;
  if(state==='play'){prevState='play';state='paused';firing=false;settingsBack=null;}
  else if(state==='dying')return;
  else settingsBack=ovKind;
  showOverlay('settings');
}
function closeSettings(){
  confirmReset=false;sfx.click();
  if(state==='paused'){state=prevState||'play';prevState=null;ovKind='none';ov.hidden=true;ov.innerHTML='';}
  else showOverlay(settingsBack||'menu');
}
$('gear').onclick=()=>{if(ovKind==='settings'&&!ov.hidden)closeSettings();else openSettings();};

/* ---------- sizing + loop ---------- */
/* The field is 360 units wide. On a tall phone it is stretched to the full screen width and made taller (up to 960 units)
   so nothing is left empty; on a short or wide window it shrinks to fit (never less than 600 tall). */
const wrap=document.getElementById('wrap');
function resize(){
  const aw=Math.min(wrap.clientWidth,480),ah=wrap.clientHeight;if(!aw||!ah)return;
  const kk=Math.min(aw/LW,ah/600),h=Math.min(960,Math.floor(ah/kk)),w=Math.round(LW*kk);
  stage.style.width=w+'px';stage.style.height=Math.round(h*kk)+'px';
  if(h!==LH){LH=h;GROUND=LH-72;if(theme){amb=theme.init();}}
  dpr=Math.min(window.devicePixelRatio||1,2.5);k=w/LW;cv.width=Math.round(LW*k*dpr);cv.height=Math.round(LH*k*dpr);bg=null;fitCard();}
new ResizeObserver(resize).observe(wrap);resize();
let prev=performance.now();
function loop(now){const dt=Math.min(1/30,(now-prev)/1000);prev=now;update(dt);draw(dt);requestAnimationFrame(loop);}

/* Blobs bounce behind the menu so the first screen already feels alive */
function seedDemo(){blobs=[];[[3,32],[2,18],[1,9],[0,4]].forEach(([s,hp])=>blobs.push(newBlob(s,hp,rnd(60,300),rnd(140,300),rnd(-70,70),0)));}
function toMenu(){
  state='menu';prevState=null;pending=null;firing=false;settingsBack=null;banner=-1;combo=0;comboT=0;slowT=0;timeScale=1;flashRed=0;screenFlash=0;
  bullets=[];parts=[];seedDemo();showOverlay('menu');hud();
}

/* Android back button (also Escape on a keyboard): pause while playing, close panels, leave from the menu */
let exitApp=null;
function goBack(){
  if(state==='dying')return;
  if(state==='play'){openSettings();return}
  if(ovKind==='settings'){closeSettings();return}
  if(state==='clear'||state==='over'){toMenu();return}
  if(exitApp)exitApp();
}
addEventListener('contextmenu',e=>e.preventDefault());

/* Android shell: Capacitor puts window.Capacitor inside the app. In a normal browser none of this runs. */
(function nativeShell(){
  const cap=window.Capacitor;
  if(!cap||!cap.isNativePlatform||!cap.isNativePlatform())return;
  try{const App=cap.registerPlugin('App');App.addListener('backButton',goBack);exitApp=()=>App.exitApp();}catch(e){}
  const hideBars=()=>{try{cap.Plugins&&cap.Plugins.SystemBars&&cap.Plugins.SystemBars.hide()}catch(e){}};
  hideBars();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)hideBars()});
})();

pickTheme();seedDemo();
showOverlay('menu');hud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
